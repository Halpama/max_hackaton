name: Deploy to VDS

# Real deploy is pull-based on the VDS:
#   max-hackaton-deploy.timer → scripts/vds-pull-deploy.sh
# GitHub-hosted runners cannot reach this Timeweb box (SSH/HTTPS time out),
# so this workflow only records that main moved; the server picks it up ~1 min.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  note-pull-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy is handled on the VDS
        run: |
          set -euo pipefail
          echo "main SHA: ${{ github.sha }}"
          echo "VDS timer pulls origin/main about every 60s and runs docker compose up -d --build."
          echo "Check on server: systemctl status max-hackaton-deploy.timer"
          echo "Health (from your network): https://api.2-rist.ru/health"
